# Example config for real TMA cores. Only overrides of DEFAULTS
# (emtrace/config.py) are needed; every option is documented there.
seed: 0
paths:
  dataset_csv: data/meso_cores.csv   # core_id,label(E/B/S),group(slide or patient),image,mpp,cellvit_json[,cellvit_graph,offset_x,offset_y]
  work_dir: runs/emtrace
  external_csv: data/mesobank_cores.csv   # optional external cohort

extract:
  segmenter: cellvit_files          # read CellViT++ outputs
  encoder: {name: hoptimus1, mpp: 0.5, stride: 112}
  concepts: {enabled: true, backend: conch}    # pathologist-concept features

pretrain: {enabled: true, epochs: 50}          # self-supervised pretraining (set false to disable)
loss:
  proportion: {enabled: true, threshold: 0.10} # WHO-proportion constraint
pseudotime: {enabled: true}                    # E->S pseudotime

train:
  split: group        # leave-one-slide-out; use `external` to train on dataset_csv and test on external_csv
  epochs: 200
  repeats: 5
